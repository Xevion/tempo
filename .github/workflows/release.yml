name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5 # zizmor: ignore[unpinned-uses]
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }} # zizmor: ignore[secrets-outside-env]
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # Mirrors the CI checks against the exact commit being published. CI runs on
  # the same push but is a separate workflow, so it cannot gate this one.
  verify:
    name: Verify
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
          fetch-depth: 0 # the baseline is scanned from a worktree

      - uses: oven-sh/setup-bun@v2 # zizmor: ignore[unpinned-uses]
        with:
          bun-version: latest

      # Matches CI: the source tree needs Node 24 to parse, the published bundle does not.
      - uses: actions/setup-node@v7 # zizmor: ignore[unpinned-uses]
        with:
          node-version: "24"

      - uses: denoland/setup-deno@v2 # zizmor: ignore[unpinned-uses]
        with:
          deno-version: v2.x

      - run: bun install --frozen-lockfile

      - name: Type Check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build CLI
        run: bun run build

      - name: Tests
        run: bun test
        env:
          TEMPO_CI_COMPAT: "1"

      - name: Audit
        uses: Xevion/advisory-action@v1

      - name: Publint
        run: bunx publint --strict

      - name: Are The Types Wrong
        run: bunx @arethetypeswrong/cli --pack .

  publish:
    name: Publish to npm
    needs: [release-please, verify]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2 # zizmor: ignore[unpinned-uses]
        with:
          bun-version: latest

      - uses: actions/setup-node@v7 # zizmor: ignore[unpinned-uses]
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # zizmor: ignore[secrets-outside-env]
