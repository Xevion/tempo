name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  checks: write

jobs:
  ci:
    name: Summary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2 # zizmor: ignore[unpinned-uses]
        with:
          bun-version: latest

      - uses: actions/setup-node@v6 # zizmor: ignore[unpinned-uses]
        with:
          node-version: "22"

      - uses: denoland/setup-deno@v2 # zizmor: ignore[unpinned-uses]
        with:
          deno-version: v2.x

      - run: bun install --frozen-lockfile

      # Every check runs to completion so the check-runs below stay informative;
      # "Enforce check results" is what turns any failure into a red job.
      - name: Type Check
        id: typecheck
        run: bun run typecheck
        continue-on-error: true

      - name: Lint
        id: lint
        run: bun run lint
        continue-on-error: true

      - name: Build CLI
        id: build
        run: bun run build
        continue-on-error: true

      - name: Tests
        id: test
        run: bun test
        continue-on-error: true
        env:
          TEMPO_CI_COMPAT: "1"

      - name: Audit
        id: audit
        run: bun audit
        continue-on-error: true

      - name: Pack Dry Run
        id: pack
        run: npm pack --dry-run
        continue-on-error: true

      - name: Publint
        id: publint
        run: bunx publint --strict
        continue-on-error: true

      - name: Are The Types Wrong
        id: attw
        run: bunx @arethetypeswrong/cli --pack .
        continue-on-error: true

      - name: Report check statuses
        if: always()
        uses: actions/github-script@v9 # zizmor: ignore[unpinned-uses,template-injection]
        with:
          script: |
            const checks = [
              { name: 'Type Check', outcome: '${{ steps.typecheck.outcome }}' },
              { name: 'Lint', outcome: '${{ steps.lint.outcome }}' },
              { name: 'Build CLI', outcome: '${{ steps.build.outcome }}' },
              { name: 'Tests', outcome: '${{ steps.test.outcome }}' },
              { name: 'Audit', outcome: '${{ steps.audit.outcome }}' },
              { name: 'Pack Dry Run', outcome: '${{ steps.pack.outcome }}' },
              { name: 'Publint', outcome: '${{ steps.publint.outcome }}' },
              { name: 'Are The Types Wrong', outcome: '${{ steps.attw.outcome }}' },
            ];
            for (const check of checks) {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: context.sha,
                name: check.name,
                conclusion: check.outcome === 'success' ? 'success' : 'failure',
                status: 'completed',
              });
            }

      - name: Enforce check results
        if: always()
        env:
          TYPE_CHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD_CLI: ${{ steps.build.outcome }}
          TESTS: ${{ steps.test.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          PACK_DRY_RUN: ${{ steps.pack.outcome }}
          PUBLINT: ${{ steps.publint.outcome }}
          ATTW: ${{ steps.attw.outcome }}
        run: |
          failed=0
          for name in TYPE_CHECK LINT BUILD_CLI TESTS AUDIT PACK_DRY_RUN PUBLINT ATTW; do
            outcome=$(printenv "$name")
            if [ "$outcome" != "success" ]; then
              echo "::error title=$name::step outcome was '$outcome'"
              failed=1
            fi
          done
          exit "$failed"
